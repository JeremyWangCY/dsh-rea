name: Publish npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Pack and test only, do not publish'
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

jobs:
  test-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out release
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          tagVersion="${GITHUB_REF_NAME#v}"
          packageVersion="$(node -p "require('./package.json').version")"
          if [ "$tagVersion" != "$packageVersion" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $packageVersion" >&2
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Unit tests
        run: node --test test/*.test.mjs

      - name: Pack
        run: npm pack

      - name: Publish
        if: github.event_name == 'push' || inputs.dry_run == false
        run: npm publish --access public --provenance
